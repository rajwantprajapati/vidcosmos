<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New video on a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vidcosmos/tokens.css">
<link rel="stylesheet" href="ds/vidcosmos/components/bundle.css">
<script src="ds/vidcosmos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brand-text)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink-secondary);cursor:pointer;text-decoration:none}
.ib:focus-visible,.row:focus-visible,.cta:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--focus-ring)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;width:100%;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 12px 0 4px;">
<a href="MobileLibrary.dc.html" class="ib" aria-label="Close"><x-import component-from-global-scope="Vidcosmos.Icon" name="x" size="{{twentyTwo}}"></x-import></a>
<span style="flex: 1; font-family: var(--font-display); font-weight: 800; font-size: 17px;">New video</span>
<span style="font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums;">Step 1 of 4 · Idea</span>
</header>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 0 16px;">
<span style="height: 4px; border-radius: 2px; background: var(--brand);"></span><span style="height: 4px; border-radius: 2px; background: var(--line);"></span><span style="height: 4px; border-radius: 2px; background: var(--line);"></span><span style="height: 4px; border-radius: 2px; background: var(--line);"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 18px; padding: 18px 0 120px;">
<div style="padding: 0 16px;">
<x-import component-from-global-scope="Vidcosmos.TextField" id="mn-topic" label="What is the video about?" multiline="{{yes}}" rows="{{three}}" default-value="How a UPI payment moves money from your bank to someone else’s, for first-time smartphone users" helper="Be specific about who it’s for."></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="padding: 0 16px; font-size: 14px; font-weight: 600;">Video type</span>
<div class="hscroll" role="group" aria-label="Video type">
<x-import component-from-global-scope="Vidcosmos.Chip" selected="{{yes}}">Explainer</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Product ad</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Story</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Travel</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Quote</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Music visual</x-import>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px;">
<span style="font-size: 14px; font-weight: 600;">Settings</span>
<div style="border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<button type="button" class="row"><span style="flex: 1; color: var(--ink-secondary);">{{r.label}}</span><span style="font-weight: 600;">{{r.value}}</span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color: var(--ink-muted);"><path d="M9 6l6 6-6 6"></path></svg></button>
</sc-for>
</div>
</div>
<div style="padding: 0 16px;">
<x-import component-from-global-scope="Vidcosmos.TextField" id="mn-notes" label="Notes (optional)" multiline="{{yes}}" rows="{{two}}" placeholder="Facts or a description to stick to"></x-import>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 28px; background: var(--surface); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px;">
<a href="MobileScript.dc.html" class="cta" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-weight: 600; font-size: 16px; text-decoration: none;"><x-import component-from-global-scope="Vidcosmos.Icon" name="sparkles" size="{{eighteen}}"></x-import>Suggest angles</a>
<span style="text-align: center; font-size: 12px; color: var(--ink-muted);">Uses 1 of 50 AI requests for this video</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, two: 2, three: 3, eighteen: 18, twentyTwo: 22,
      rows: [
        { label: 'Length', value: '60 s' },
        { label: 'Language', value: 'English' },
        { label: 'Narrator', value: 'Indian female' },
        { label: 'Format', value: '9:16' },
        { label: 'Tone and audience', value: 'Friendly · beginners' }
      ]
    };
  }
}
</script>
</body>
</html>
