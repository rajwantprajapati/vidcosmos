<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library on a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vidcosmos/tokens.css">
<link rel="stylesheet" href="ds/vidcosmos/components/bundle.css">
<script src="ds/vidcosmos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brand-text)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink-secondary);position:relative;cursor:pointer}
.ib:focus-visible,.m-search:focus-visible,.start:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--focus-ring)}
.m-search{font:inherit;font-size:16px;width:100%;box-sizing:border-box;min-height:44px;padding:10px 14px 10px 40px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<header style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 8px 0 16px;">
<x-import component-from-global-scope="Vidcosmos.Logo" size="{{logoSize}}"></x-import>
<span style="display: flex; align-items: center;">
<button type="button" class="ib" aria-label="Notifications, 2 unread">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8zM10 20a2 2 0 0 0 4 0"></path></svg>
<span style="position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger-fill);"></span>
</button>
<span style="width: 34px; height: 34px; margin: 0 4px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-text); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;">RP</span>
</span>
</header>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 4px 0 0;">
<h1 style="margin: 0; padding: 0 16px; font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -0.025em;">Your library</h1>
<div style="position: relative; margin: 0 16px;">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" style="position: absolute; left: 13px; top: 13px; color: var(--ink-muted);"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label for="ml-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search videos</label>
<input id="ml-search" class="m-search" type="search" placeholder="Search videos">
</div>
<a href="MobileNewVideo.dc.html" class="start" style="margin: 0 16px; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink);">
<span style="font-size: 13px; font-weight: 600;">Start a new video</span>
<span style="display: flex; align-items: center; gap: 10px;">
<span style="flex: 1; min-height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; background: var(--surface-sunken); color: var(--ink-muted); font-size: 15px;">Describe your video…</span>
<span style="width: 44px; height: 44px; border-radius: 10px; background: var(--brand); color: var(--on-brand); display: inline-flex; align-items: center; justify-content: center;"><x-import component-from-global-scope="Vidcosmos.Icon" name="sparkles" size="{{twenty}}"></x-import></span>
</span>
</a>
<div class="hscroll" role="group" aria-label="Filter videos">
<x-import component-from-global-scope="Vidcosmos.Chip" selected="{{yes}}">All 7</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Drafts 1</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Ready 3</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Scheduled 2</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Failed 1</x-import>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 0 16px;">
<x-import component-from-global-scope="Vidcosmos.VideoCard" title="How UPI moves your money" type="Explainer" duration="0:56" status="ready" theme="midnight" caption="{{capUpi}}" href="MobileEditor.dc.html"></x-import>
<x-import component-from-global-scope="Vidcosmos.VideoCard" title="Diwali gift guide" type="Product ad" status="generating" status-label="62%" progress="{{sixtyTwo}}" theme="sunset"></x-import>
<x-import component-from-global-scope="Vidcosmos.VideoCard" title="Ember &amp; Wick launch" headline="Ember &amp; Wick" type="Product ad" duration="0:20" status="scheduled" status-label="Fri 9 am" theme="sunset"></x-import>
<x-import component-from-global-scope="Vidcosmos.VideoCard" title="Ladakh in 30 seconds" headline="Sunrise over Pangong" type="Travel" duration="0:30" status="failed" status-label="Post failed" theme="ocean"></x-import>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0;"><dc-import name="MobileTabBar" active="library" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { logoSize: 24, twenty: 20, yes: true, sixtyTwo: 62, capUpi: { before: 'your friend has the', word: 'money' } };
  }
}
</script>
</body>
</html>
