<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Posts on a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vidcosmos/tokens.css">
<link rel="stylesheet" href="ds/vidcosmos/components/bundle.css">
<script src="ds/vidcosmos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brand-text)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink-secondary);cursor:pointer;text-decoration:none}
.ib:focus-visible,.post:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--focus-ring)}
.post{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font:inherit;color:var(--ink);text-align:left;width:100%;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<header style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 8px 0 16px;">
<span style="flex: 1; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em;">Posts</span>
<a href="MobileExport.dc.html" class="ib" aria-label="Schedule a post"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></a>
</header>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 110px;">
<div role="status" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--warning-soft); color: var(--warning); font-size: 14px; line-height: 20px;">
<x-import component-from-global-scope="Vidcosmos.Icon" name="alert" size="{{eighteen}}"></x-import>
<span style="flex: 1;">Instagram connection ends in 6 days.</span>
<a href="#" style="font-weight: 600; color: inherit;">Reconnect</a>
</div>
<x-import component-from-global-scope="Vidcosmos.SegmentedControl" label="Show posts" options="{{filters}}" value="{{filter}}" on-change="{{setFilter}}"></x-import>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<span style="margin-top: 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted);">{{g.title}}</span>
<sc-for list="{{g.items}}" as="p" hint-placeholder-count="2">
<button type="button" class="post">
<span aria-hidden="true" style="width: 48px; height: 86px; flex: none; border-radius: 8px; background: {{p.bg}};"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
<span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.title}}</span>
<span style="font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums;">{{p.when}}</span>
<span style="display: flex; align-items: center; gap: 8px;">
<x-import component-from-global-scope="Vidcosmos.Badge" tone="{{p.tone}}">{{p.status}}</x-import>
<sc-if value="{{p.failed}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 600; color: var(--brand-text);">Try again</span></sc-if>
</span>
</span>
</button>
</sc-for>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0;"><dc-import name="MobileTabBar" active="posts" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, st = this.state || {};
    var filter = st.filter || 'all';
    var P = [
      { title: 'How UPI moves your money', when: 'Wed 11 Nov · 6:30 pm', status: 'Scheduled', tone: 'info', group: 'Coming up', bg: 'var(--video-midnight-bg)' },
      { title: 'Ember & Wick: the autumn candle drop', when: 'Fri 13 Nov · 9:00 am', status: 'Scheduled', tone: 'info', group: 'Coming up', bg: 'var(--video-sunset-bg)' },
      { title: 'Monday motivation: start small', when: 'Mon 9 Nov · 8:00 am · 1,240 views', status: 'Published', tone: 'success', group: 'Earlier', bg: 'var(--video-ocean-bg)' },
      { title: '3 days in Ladakh on a budget', when: 'Sat 7 Nov · 7:00 pm · Instagram refused the upload', status: 'Failed', tone: 'danger', group: 'Earlier', failed: true, bg: 'var(--video-paper-bg)' }
    ].filter(function (p) {
      if (filter === 'scheduled') return p.status === 'Scheduled';
      if (filter === 'published') return p.status !== 'Scheduled';
      return true;
    });
    var groups = ['Coming up', 'Earlier'].map(function (t) {
      return { title: t, items: P.filter(function (p) { return p.group === t; }).map(function (p) { return Object.assign({ failed: false }, p); }) };
    }).filter(function (g) { return g.items.length; });
    return {
      eighteen: 18, filter: filter, groups: groups,
      filters: [{ value: 'all', label: 'All' }, { value: 'scheduled', label: 'Scheduled' }, { value: 'published', label: 'Past' }],
      setFilter: function (v) { self.setState({ filter: v }); }
    };
  }
}
</script>
</body>
</html>
