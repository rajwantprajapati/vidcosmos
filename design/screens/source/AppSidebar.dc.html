<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App sidebar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vidcosmos/tokens.css">
<link rel="stylesheet" href="ds/vidcosmos/components/bundle.css">
<script src="ds/vidcosmos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<aside aria-label="App" style="width: 100%; height: 100%; min-height: 960px; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 24px; background: var(--surface); border-right: 1px solid var(--line); font-family: var(--font-sans); color: var(--ink);">
<a href="Main.dc.html" aria-label="Vidcosmos home" style="display: inline-flex; padding: 4px 8px;">
<x-import component-from-global-scope="Vidcosmos.Logo" size="{{logoSize}}"></x-import>
</a>
<a href="NewVideo.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-weight: 600; font-size: 15px; text-decoration: none;">
<x-import component-from-global-scope="Vidcosmos.Icon" name="sparkles" size="{{iconSize}}"></x-import>New video
</a>
<nav aria-label="Sections" style="display: flex; flex-direction: column; gap: 4px;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" aria-current="{{it.current}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: {{it.weight}}; color: {{it.color}}; background: {{it.bg}};">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d}}"></path></svg>
<span style="flex: 1;">{{it.label}}</span>
<sc-if value="{{it.count}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-sunken); color: var(--ink-secondary);">{{it.count}}</span></sc-if>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 20px;">
<div style="padding: 16px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line);">
<x-import component-from-global-scope="Vidcosmos.UsageMeter" used="{{used}}" max="{{max}}" resets-on="1 Dec"></x-import>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px;">
<span style="width: 36px; height: 36px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-text); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;">RP</span>
<span style="display: flex; flex-direction: column; min-width: 0;">
<span style="font-weight: 600; font-size: 14px;">Rajwant</span>
<span style="font-size: 12px; color: var(--ink-muted);">Free beta</span>
</span>
</div>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["library","posts","settings","none"],"default":"library"},"$preview":{"width":248,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'library';
    var defs = [
      { key: 'library', label: 'Library', href: 'Library.dc.html', d: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
      { key: 'posts', label: 'Posts', href: 'Posts.dc.html', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', count: '3' },
      { key: 'settings', label: 'Settings', href: 'Settings.dc.html', d: 'M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6' }
    ];
    var items = defs.map(function (d) {
      var on = d.key === active;
      return { label: d.label, href: d.href, d: d.d, count: d.count || false, current: on ? 'page' : 'false', weight: on ? '600' : '500', color: on ? 'var(--brand-text)' : 'var(--ink-secondary)', bg: on ? 'var(--brand-soft)' : 'transparent' };
    });
    return { items: items, logoSize: 28, iconSize: 18, used: 12, max: 20 };
  }
}
</script>
</body>
</html>
