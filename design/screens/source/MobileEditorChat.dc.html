<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Revise sheet on a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vidcosmos/tokens.css">
<link rel="stylesheet" href="ds/vidcosmos/components/bundle.css">
<script src="ds/vidcosmos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brand-text)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink-secondary);cursor:pointer;text-decoration:none}
.ib:focus-visible,.chatbox:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--focus-ring)}
.chatbox{font:inherit;font-size:16px;line-height:22px;width:100%;box-sizing:border-box;resize:none;border:1px solid var(--line-strong);border-radius:22px;padding:11px 52px 11px 16px;background:var(--surface);color:var(--ink)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div data-theme="dark" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 12px 0 4px;">
<span class="ib" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></span>
<span style="flex: 1; font-family: var(--font-display); font-weight: 800; font-size: 15px;">How UPI moves your money</span>
</header>
<div aria-hidden="true" style="display: flex; justify-content: center; padding-top: 6px;">
<div style="width: 170px; height: 302px; border-radius: 14px; background: var(--video-midnight-bg); padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; color: #FFFFFF;">
<span style="font-family: var(--font-display); font-size: 13px; font-weight: 800; line-height: 1.1;">One payment, three hops</span>
<span style="height: 26px; border-radius: 8px; background: var(--video-midnight-panel);"></span>
<span style="height: 26px; border-radius: 8px; background: #1D2C5E; border: 1.5px solid var(--video-midnight-accent);"></span>
<span style="height: 26px; border-radius: 8px; background: var(--video-midnight-panel); opacity: .35;"></span>
</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim);"></div>

<section role="dialog" aria-label="Revise" style="position: absolute; left: 0; right: 0; bottom: 0; height: 600px; border-radius: 20px 20px 0 0; background: var(--surface); box-shadow: var(--shadow-lg); display: flex; flex-direction: column;">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong); margin-top: 8px;"></span>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 18px;">
<span style="flex: 1; font-family: var(--font-display); font-weight: 800; font-size: 18px;">Revise</span>
<a href="MobileEditor.dc.html" class="ib" aria-label="Close"><x-import component-from-global-scope="Vidcosmos.Icon" name="x" size="{{twenty}}"></x-import></a>
</div>
<div style="padding: 0 16px 12px; border-bottom: 1px solid var(--line);">
<x-import component-from-global-scope="Vidcosmos.SegmentedControl" label="What to change" options="{{scopes}}" default-value="scene"></x-import>
</div>
<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px;">
<x-import component-from-global-scope="Vidcosmos.ChatMessage" role="user">Show the banks as two separate boxes.</x-import>
<x-import component-from-global-scope="Vidcosmos.ProposalCard" summary="I’ll split “Banks” into “Your bank” and “Their bank”, each appearing on its own word. The narration stays the same." scenes="Scene 3" duration="0:56"></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 10px 16px 26px; border-top: 1px solid var(--line);">
<div class="hscroll" role="group" aria-label="Suggestions">
<x-import component-from-global-scope="Vidcosmos.Chip">Make it shorter</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Slower voice</x-import>
<x-import component-from-global-scope="Vidcosmos.Chip">Add a quiz</x-import>
</div>
<div style="position: relative;">
<label for="mc-chat" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Ask for a change</label>
<textarea id="mc-chat" class="chatbox" rows="1" placeholder="Ask for a change to scene 3…"></textarea>
<button type="button" aria-label="Send" style="position: absolute; right: 5px; top: 5px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--brand); color: var(--on-brand); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;"><x-import component-from-global-scope="Vidcosmos.Icon" name="arrow-up" size="{{eighteen}}"></x-import></button>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { scopes: [{ value: 'video', label: 'Whole video' }, { value: 'scene', label: 'Scene 3' }], eighteen: 18, twenty: 20 };
  }
}
</script>
</body>
</html>
